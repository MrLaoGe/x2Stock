name: Verify and release x2Stock

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public assets and configuration examples
        run: python scripts/verify_repository.py
      - name: Test Git notification behavior without network access
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate canonical release materials
        run: python .agents/skills/github-release/scripts/release.py check
      - name: Require a version for each main update
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
        run: python .agents/skills/github-release/scripts/release.py check --base-sha "$RELEASE_BASE_SHA"
      - name: Check whitespace
        env:
          DOCS_EVENT_NAME: ${{ github.event_name }}
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_BEFORE_SHA: ${{ github.event.before }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$DOCS_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$DOCS_BASE_SHA" "$DOCS_HEAD_SHA"
          elif [ -n "$DOCS_BEFORE_SHA" ] && [ "$DOCS_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$DOCS_BEFORE_SHA" "$DOCS_HEAD_SHA"
          else
            DOCS_EMPTY_TREE=$(git hash-object -t tree --stdin < /dev/null)
            git diff --check "$DOCS_EMPTY_TREE" "$DOCS_HEAD_SHA"
          fi

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require materialized and source-matching shipped Windows runtime
        run: python scripts/verify_desktop_runtime.py --materialized
      - name: Install and validate renderer sources
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint:style
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:preferences
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install desktop test dependencies without runtime download scripts
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Test desktop contracts with synthetic fixtures
        run: node --test "desktop/tests/*.test.cjs"
      - name: Launch shipped root BAT offline and require nonempty renderer
        run: python scripts/smoke_project_archive.py --root "$env:GITHUB_WORKSPACE"
      - name: Download and verify actual complete main source archive
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
        env:
          ARCHIVE_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/verify_project_archive.py --sha $env:ARCHIVE_SHA --version $version --archive "$env:RUNNER_TEMP/x2stock-project.zip" --download --extract "$env:RUNNER_TEMP/x2stock-project" --metadata "$env:RUNNER_TEMP/x2stock-update.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch actual downloaded project BAT offline
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
        run: python scripts/smoke_project_archive.py --root "$env:RUNNER_TEMP/x2stock-project"
      - name: Preserve only archive-verified update metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
        uses: actions/upload-artifact@v4
        with:
          name: update-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/x2stock-update.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [verify, windows-runtime]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve metadata from the successful exact-SHA Windows gate
        uses: actions/download-artifact@v4
        with:
          name: update-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/update-metadata
      - name: Publish or recover exact-commit Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .agents/skills/github-release/scripts/release.py publish --receipt "$RUNNER_TEMP/x2stock-release.json"
      - name: Upload or reuse and verify immutable updater metadata on the same Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_update_metadata.py --metadata "$RUNNER_TEMP/update-metadata/x2stock-update.json" --release-receipt "$RUNNER_TEMP/x2stock-release.json"
      - name: Notify channel after verified Release
        env:
          VOCECHAT_ENABLED: ${{ vars.VOCECHAT_ENABLED }}
          VOCECHAT_BASE_URL: ${{ secrets.VOCECHAT_BASE_URL }}
          VOCECHAT_API_KEY: ${{ secrets.VOCECHAT_API_KEY }}
          VOCECHAT_GROUP_ID: ${{ vars.VOCECHAT_GROUP_ID || '19' }}
          VOCECHAT_API_PREFIX: ${{ vars.VOCECHAT_API_PREFIX || '/api/bot' }}
          VOCECHAT_TIMEOUT_SECONDS: ${{ vars.VOCECHAT_TIMEOUT_SECONDS || '15' }}
        run: python scripts/vocechat_notify.py --release-file "$RUNNER_TEMP/x2stock-release.json"
